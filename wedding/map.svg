<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 380" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#c04040"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="420" height="380" fill="#f0ebe0"/>

  <!-- 서울식물원 -->
  <rect x="252" y="12" width="168" height="222" rx="6" fill="#b8d4a0"/>
  <text x="336" y="120" text-anchor="middle" font-size="14" fill="#2a5a18" font-weight="bold">서울식물원</text>

  <!-- LG사이언스파크 -->
  <rect x="268" y="246" width="140" height="62" rx="4" fill="#cce8a8"/>
  <text x="338" y="280" text-anchor="middle" font-size="10" fill="#3a5a20">LG사이언스파크</text>

  <!-- 메인 가로도로 (마곡중앙5로) -->
  <rect x="0" y="196" width="420" height="24" fill="#ddd0a8"/>
  <text x="350" y="212" font-size="8" fill="#9a8a60" letter-spacing="0.5">마곡중앙5로</text>

  <!-- 메인 세로도로 -->
  <rect x="228" y="0" width="24" height="380" fill="#ddd0a8"/>

  <!-- 보조 가로도로 -->
  <rect x="0" y="272" width="232" height="14" fill="#e8e0cc"/>

  <!-- 공항철도 라인 (파란색) -->
  <rect x="237" y="12" width="6" height="178" fill="#88b4d0" opacity="0.7"/>
  <text x="240" y="100" font-size="7" fill="#3a6080" transform="rotate(-90 240 100)">공항철도</text>

  <!-- 마곡나루역 바 -->
  <rect x="44" y="190" width="186" height="36" rx="5" fill="#5a3820"/>
  <!-- 9호선 뱃지 -->
  <circle cx="60" cy="208" r="11" fill="#f0c020"/>
  <text x="60" y="212" text-anchor="middle" font-size="11" fill="#3a2010" font-weight="bold">9</text>
  <!-- 역 이름 -->
  <text x="155" y="213" text-anchor="middle" font-size="14" fill="white" font-weight="bold">마곡나루역</text>

  <!-- 보타닉파크웨딩 건물 (파란 유리 건물) -->
  <rect x="160" y="76" width="56" height="110" rx="2" fill="#90b8d8"/>
  <line x1="171" y1="82" x2="171" y2="184" stroke="#5888b0" stroke-width="7"/>
  <line x1="182" y1="82" x2="182" y2="184" stroke="#5888b0" stroke-width="7"/>
  <line x1="193" y1="82" x2="193" y2="184" stroke="#5888b0" stroke-width="7"/>
  <line x1="204" y1="82" x2="204" y2="184" stroke="#5888b0" stroke-width="7"/>
  <line x1="215" y1="82" x2="215" y2="184" stroke="#5888b0" stroke-width="7"/>
  <rect x="160" y="76" width="56" height="8" fill="#6898b8"/>

  <!-- 보타닉파크웨딩 라벨 박스 -->
  <rect x="60" y="14" width="172" height="50" rx="5" fill="#4a2818"/>
  <text x="146" y="35" text-anchor="middle" font-size="13" fill="white" font-weight="bold">보타닉파크웨딩</text>
  <text x="146" y="53" text-anchor="middle" font-size="9" fill="#d0b080">푸르지오시티 L층 (로비층)</text>
  <!-- 라벨 → 건물 연결선 -->
  <line x1="180" y1="64" x2="186" y2="76" stroke="#4a2818" stroke-width="1.5"/>

  <!-- 주차장 진입구 -->
  <text x="102" y="142" text-anchor="middle" font-size="9" fill="#c04040">주차장</text>
  <text x="102" y="153" text-anchor="middle" font-size="9" fill="#c04040">진입구</text>
  <line x1="118" y1="158" x2="138" y2="180" stroke="#c04040" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ① ② 진입구 번호 -->
  <circle cx="148" cy="186" r="9" fill="white" stroke="#5a3820" stroke-width="1.5"/>
  <text x="148" y="190" text-anchor="middle" font-size="11" fill="#5a3820">①</text>
  <circle cx="222" cy="186" r="9" fill="white" stroke="#5a3820" stroke-width="1.5"/>
  <text x="222" y="190" text-anchor="middle" font-size="11" fill="#5a3820">②</text>

  <!-- 웰튼병원 -->
  <circle cx="22" cy="118" r="5" fill="#c0c0c0"/>
  <text x="22" y="100" text-anchor="middle" font-size="9" fill="#5a4a3a">웰튼</text>
  <text x="22" y="111" text-anchor="middle" font-size="9" fill="#5a4a3a">병원</text>

  <!-- 올리브영 -->
  <circle cx="32" cy="170" r="5" fill="#c0c0c0"/>
  <text x="32" y="158" text-anchor="middle" font-size="9" fill="#5a4a3a">올리브영</text>

  <!-- 코트야드 메리어트 -->
  <circle cx="266" cy="172" r="5" fill="#c0c0c0"/>
  <text x="298" y="158" text-anchor="middle" font-size="9" fill="#3a4a30" font-weight="600">코트야드</text>
  <text x="298" y="170" text-anchor="middle" font-size="9" fill="#3a4a30" font-weight="600">메리어트 호텔</text>

  <!-- 코엑스마곡 / 마곡 광장 -->
  <text x="46" y="244" text-anchor="middle" font-size="14" fill="#4a80c8" font-weight="bold">P</text>
  <text x="46" y="260" text-anchor="middle" font-size="9" fill="#5a5a6a">코엑스마곡</text>
  <text x="138" y="252" text-anchor="middle" font-size="9" fill="#5a5a6a">마곡 광장</text>

  <!-- 역 원형 마커 -->
  <circle cx="80" cy="328" r="13" fill="white" stroke="#9a9aaa" stroke-width="2"/>
  <text x="80" y="356" text-anchor="middle" font-size="11" fill="#3a3a4a">마곡역</text>

  <circle cx="350" cy="328" r="13" fill="white" stroke="#9a9aaa" stroke-width="2"/>
  <text x="350" y="356" text-anchor="middle" font-size="11" fill="#3a3a4a">발산역</text>

  <circle cx="396" cy="32" r="12" fill="white" stroke="#9a9aaa" stroke-width="2"/>
  <text x="385" y="60" text-anchor="middle" font-size="9" fill="#3a3a4a">양천향교역</text>
</svg>
